# main 푸시와 PR마다 dist를 새로 빌드하고 전체 테스트를 돌린다. 하나라도 실패하면 빨간불.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04   # ubuntu-latest가 26.04로 바뀌어 Playwright 1.56 chromium 설치가 막힌다 (2026-11-08)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Playwright 설치
        # apt 미러 이름 풀이가 잠깐 끊기면 설치가 죽는다 (2026-11-11). 세 번까지 다시 해 보고, 그래도 안 되면 글꼴 추가 설치는 건너뛰고 브라우저만 받는다 (라이브러리는 이미 있다)
        run: |
          npm i --no-save playwright@1.56.1
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "설치 실패 ($i/3), 30초 뒤 다시"; sleep 30; sudo apt-get update || true
          done
          npx playwright install chromium
      - name: 빌드
        run: python3 build.py
      - name: dist가 소스와 같은지
        run: git diff --exit-code --stat dist/ || (echo "dist가 src와 다릅니다. python3 build.py 후 커밋하세요." && exit 1)
      - name: 테스트
        run: node tests/run.js -j 2
      - name: 스크린샷 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: shots, path: tests/shots, if-no-files-found: ignore}
