    <p class="note">숙련은 적을 쓰러뜨리거나 운기조식할 때 오른다. 문파 패시브는 같은 종류의 하위 무공을 대성(숙련 50)해야 익힐 수 있다.</p></div>`}
function pasSectHtml(s){
  const list=pasOf(s.id),member=P.sect===s.id;
  return `<h4 style="margin:0">문파 패시브 <small class="dim">직위가 오르면 더 익힐 수 있다</small></h4><div class="list">${list.map(p=>{const no=pasBlock(p);
    return pasRow(p,P.pas&&P.pas[p.id]?'<small class="good">익힘</small>':member?B('plearn:'+p.id,no||`익히기 · 공적 ${pasCost(p)}`,{d:!!no,pri:!no}):`<small class="dim">${no}</small>`)}).join('')}</div>`}

// ================= 세력 무인, 문파 직위, 문파 본산 =================
// 정파·사파·마교 무인 몹은 서로 적이다. 정파와 사파는 서로 싸우고, 마교는 정사 모두를 공격한다.
// 플레이어 편(문파의 세력, 없으면 정·사 성향)과 같은 무인은 먼저 덤비지 않는다.
// 문파마다 본산 지역맵(40×40)이 따로 있고, 개봉 역참에서 말을 타고 간다. 가입은 본산의 장문인에게만 청한다.
// 설계: docs/세력_문파_설계.md 8~10장
const alFac=al=>al==='magyo'?'마':ALLY[al].side;
const FACN=GD.FACN;
// 플레이어 편: 마교 제자면 '마', 문파가 있으면 그 세력, 없으면 타고난 성향
function pfac(){const s=P&&P.sect&&SECTS[P.sect];return s?alFac(s.al):P?P.side:'정'}
const facFoe=(a,b)=>!!a&&!!b&&a!==b;
// 이 무인이 플레이어에게 적인가: 다른 편이거나, 같은 편이라도 공격당해 등을 돌렸으면 적
const mobFoeP=e=>e.angry||facFoe(e.d.fac,pfac());
const peaceful=m=>!!m.d.fac&&!mobFoeP(m);
const FAC_KIND=GD.FAC_KIND;
/* MOBS에 덧붙이던 것은 data/mobs.json 으로 옮김 */
// 옷 색: 정파 흰옷·청띠, 사파 갈색·자주띠, 마교 검은옷·붉은띠, 소림은 가사
const FAC_ROBE=GD.FAC_ROBE;
function facPal(fac,cls,elite,sid){
  const look=sid==='shaolin'?'소림':fac,k=`fac_${look}_${cls}_${elite?1:0}`;
  if(!PAL[k])PAL[k]={...PAL.hero,...FAC_ROBE[look],weapon:CLASS[cls].draw,anim:CLASS[cls].anim,jade:0,beard:elite?1:0,armor:elite&&fac!=='정'?1:0};
  return k}
// 무인 하나를 만든다. sid를 주면 그 문파 제자, 없으면 그 세력의 아무 문파
function mkFac(fac,elite,x,y,sid){
  const s=SECTS[sid]||pick(Object.values(SECTS).filter(q=>alFac(q.al)===fac)),a=pick(s.arts.filter(q=>!q.hi)),cls=a.cls,kind=FAC_KIND[fac][elite?1:0];
  const e=mkMob(kind,x,y),bow=cls==='궁';
  e.d={...e.d,el:a.el,ranged:bow?1:0};e.el=a.el;e.reach=bow?5:cls==='창'?1.8:cls==='봉'?1.6:1.3;
  // 직위: 제자는 속가·정식, 고수는 일대·호법(당주). 옷과 이름이 직위를 따른다
  const rank=elite?(Math.random()<.65?2:3):(Math.random()<.35?0:1);e.rank=rank;
  e.pal=sectPal(s.id,rank,cls,{elite})||facPal(fac,cls,elite,s.id);e.sect=s.id;e.name=`${s.n} ${rankName(s.id,rank)}`;
  runHooks('facMade',e);return e}
// 0.5초마다 주변의 적 세력 무인을 찾아 노린다
function facScan(e,dt){
  e.fscan=(e.fscan||0)-dt;if(e.fscan>0)return;e.fscan=.45+Math.random()*.2;
  if(e.tgt&&e.tgt.hp>0&&e.tgt.isMob&&dist(e,e.tgt)<12)return;
  if(e.aggro&&!e.tgt&&mobFoeP(e)&&dist(e,P)<4)return;   // 플레이어와 붙어 있으면 그대로
  let b=null,bd=(e.d.aggro||6)+1;
  for(const o of mobs)if(o!==e&&o.hp>0&&o.d.fac&&facFoe(o.d.fac,e.d.fac)){const q=dist(o,e);if(q<bd){bd=q;b=o}}
  if(b){e.tgt=b;e.aggro=true}
}
// 몹끼리의 타격. 쓰러져도 전리품은 없고, 가끔 은자 주머니가 떨어진다.
function mobHurt(t,dm,src){
  if(t.hp<=0)return;{const c={t,src,dm};runHooks('mobHurt',c);dm=c.dm}
  dm=Math.max(1,Math.round(dm*(.9+Math.random()*.2)-(t.def||0)));t.hp-=dm;t.hit=.12;
  if(dist(t,P)<14)addText(t.x,t.y,dm,'#c8b8a0');
  if(t.d.fac&&(!t.tgt||t.tgt.hp<=0||!t.tgt.isMob||Math.random()<.3)){t.tgt=src;t.aggro=true}
  if(t.hp<=0){t.hp=0;fx.push({t:'puff',x:t.x,y:t.y,life:.6});if(P.target===t)P.target=null;
    if(dist(t,P)<12)log(`${src.name}이(가) ${t.name}을(를) 쓰러뜨렸습니다.`,'info');
    if(Math.random()<.35)drops.push({x:t.x,y:t.y,it:{silver:R1(2,6)},t:Math.random()*6})}
}
// 같은 편 무인을 친 대가: 악업, 그 무인과 주변 동도가 등을 돌린다
function facBetray(e){
  if(e.angry)return;e.angry=1;e.aggro=true;e.tgt=null;P.evil+=P.side==='정'?6:2;
  for(const o of mobs)if(o!==e&&o.hp>0&&o.d.fac===e.d.fac&&dist(o,e)<6){o.angry=1;o.aggro=true;o.tgt=null}
  log(`같은 편인 ${e.name}을(를) 공격했습니다. 악업이 쌓이고 주변 동도가 등을 돌립니다.`,'dmg');
}
// 플레이어가 무인을 쓰러뜨렸을 때: 적 세력이면 문파 공적, 같은 편이면 악업
function facKill(e){
  if(!e.d.fac)return;
  if(facFoe(e.d.fac,pfac())){if(P.sect&&SECTS[P.sect]){const v=addMerit(P.sect,e.d.elite?6:2);log(`${SECTS[P.sect].n} 공적 +${v}`,'xp')}}
  else{P.evil+=P.side==='정'?10:4;log(`동도 ${e.name}을(를) 죽였습니다. 무거운 악업이 쌓였습니다.`,'dmg')}

// 원본 좌표 → 성 전체 맵 칸 (가장자리 6칸 안쪽)
function lmTile(k,x,y,S){const B=LM_BOX[k],u=clamp((x-B[0])/(B[2]-B[0]),0,1),v=clamp((y-B[1])/(B[3]-B[1]),0,1);return{x:6+u*(S-12),y:6+v*(S-12)}}

function lmFree(x,y,S,taken,gap){let best=null,bd=-1;

// ================= 천하: 성(省) 지도 14곳 =================
// 탄마 중국무림전도(누구나 무료 사용)를 참고해 성과 이웃 관계, 문파 자리를 정했다. 설계: docs/맵이동_설계.md
// - 성 하나 = 지역 하나. 크기는 지도에서 차지하는 넓이에 따라 44~64칸(본산·개봉·숭산은 40칸).
// - 성끼리는 가장자리 출입구로 지도 위치대로 잇는다. 성 안의 본산 입구(안쪽 출입구)로 각 문파 본산에 들어간다.
// - 개봉은 하남성 동쪽의 성 안 마을(지역 개봉), 숭산 소림사는 개봉 북쪽으로 그대로 잇는다.
// map: 무림전도(2000×1333)에서의 자리, 천하 지도 창에 그린다
// size: 실제 면적(만 ㎢)에 비례한 한 변 칸 수. 하남(16.7만 ㎢)=48칸 기준, 칸 수 = 48×√(면적/16.7만). 해남도만 본산 입구가 들어가도록 30칸으로 올렸다.
const PROV=GD.PROV;
// 성을 40×40 맵 여러 장으로 나눈다 (2026-10-09 사용자 결정, g_split.js): 한 변 맵 수 = round(실제 칸 수/32).

for(const p of Object.values(PROV)){p.real=p.size;p.cols=Math.max(1,Math.round(p.size/32));p.size=p.cols*40}
const pvId=k=>'pv_'+k;

const PV_LINKS=GD.PV_LINKS;
const pvEdge=(S,sd,t)=>{const v=Math.floor(t*S)+.5;return sd==='n'?{x:v,y:1.2}:sd==='s'?{x:v,y:S-1.4}:sd==='w'?{x:1.2,y:v}:{x:S-1.4,y:v}};
const pvIn=(S,sd,t)=>{const v=Math.floor(t*S)+.5;return sd==='n'?{x:v,y:3.6}:sd==='s'?{x:v,y:S-3.8}:sd==='w'?{x:3.6,y:v}:{x:S-3.8,y:v}};
const pvOfSect=sid=>Object.keys(PROV).find(k=>PROV[k].sects.includes(sid));
// 성 안 출입구(본산 입구·개봉) 자리: 가장자리에서 7칸 이상, 서로 9칸 이상 떨어뜨린다
function pvInner(k,p){
  const S=p.size,r=rng(5300+k.length*97+k.charCodeAt(0)*13),pts=[];
  // 무림전도에 자리가 있는 문파와 개봉은 그 자리로 (g_landmark.js), 나머지는 예전처럼 떨어진 빈자리

  for(const sid of p.sects){const q=lmSectSpot(k,sid,S,pts);if(q)pts.push({...q,to:'hq_'+sid})}
  for(const sid of p.sects){if(LM_SECT[sid])continue;let best=null;for(let t=0;t<200;t++){const x=7+Math.floor(r()*(S-14))+.5,y=7+Math.floor(r()*(S-14))+.5;
    if(Math.hypot(x-S/2,y-S/2)<6)continue;const d=Math.min(99,...pts.map(q=>Math.hypot(q.x-x,q.y-y)));if(d>=9){best={x,y};break}if(!best||d>best.d)best={x,y,d}}
    pts.push({x:best.x,y:best.y,to:'hq_'+sid})}

// 바닥 그림은 본산 그림을 같이 쓴다 (테마 이름이 다르면 풀빛만 고른다)
const PV_PAINT=GD.PV_PAINT;
HQ_GRASS.miao=[48,66,40];HQ_GRASS.subtrop=[34,76,36];HQ_GRASS.plateau=[70,74,52];HQ_GRASS.steppe=[78,100,50];HQ_GRASS.india=[88,92,46];

// 지형 규칙: base 바닥, alt(높은 곳) 바닥, 나무·바위 밀도, 물(강·호수·바다)
const PV_TH=GD.PV_TH;
// 성 지역 등록
for(const[k,p]of Object.entries(PROV)){

  for(const[a,sa,ta,b,sb,tb]of PV_LINKS){
    if(a===k){const at=pvIn(PROV[b].size,sb,tb);gates.push({...pvEdge(S,sa,ta),to:pvId(b),tx:at.x,ty:at.y,label:PROV[b].n,sd:sa})}

      else if(th==='forest')o=v<.16?'tree':v<.25?'pine':v<.3&&hi<.45?'bamboo':null;
      else if(th==='manor')o=v<.05?'tree':v<.06?'rock':null;
      else if(th==='canyon')o=cliff>.62?'rock':v<.08?'rock':v<.1?'tree':null;
      else if(th==='sand')o=v<.05?'rock':v<.06?'tree':null;
      else o=v<.08?'tree':v<.1?'rock':null}
    map[y][x]={g,v:r()};objs[y][x]=o}}
  // 산문 벽: 길만 터 두고 가로로 막는다. 길 양옆에 망루
  for(const w of[].concat(c.wall||[])){const rx=road(w);for(let y=w;y<=w+1;y++)for(let x=1;x<N-1;x++)if(Math.abs(x-rx-.5)>1.5){objs[y][x]='rock';if(map[y][x].g===2)map[y][x].g=6}
    c.builds=[...(c.builds||[]),{x:rx-4,y:w-1,w:2,h:2},{x:rx+4,y:w-1,w:2,h:2}]}
  for(const b0 of c.builds||[]){const b={...b0,mg:c.mg,rc:b0.rc||c.rc};for(let j=b.y;j<b.y+b.h;j++)for(let i=b.x;i<b.x+b.w;i++){objs[j][i]='B';if(map[j][i].g===2||map[j][i].g===1)map[j][i].g=4}builds.push(b)}
  for(const[x,y]of c.lamps||[])if(objs[y][x]==null&&!onRoad(x,y)){objs[y][x]='lamp';lamps.push({x:x+.5,y:y+.5,p:r()*6})}
  if(c.flags)placeFlags(c.s.id,c.flags);
  stageFlavor(c,r,{road,onRoad,inYard,yd,yEnd});
  for(let y=0;y<NH;y++)for(let x=0;x<N;x++)if(map[y][x].g===3)rails.push({x,y});
  const put=(t,x,y)=>{if(walk(x,y)&&!onRoad(x,y)&&!nodes.some(n=>n.x===x+.5&&n.y===y+.5))nodes.push({t,x:x+.5,y:y+.5,cd:0})};
  const want=(t,n,ok)=>{for(let i=0;i<500&&nodes.filter(q=>q.t===t).length<n;i++){const x=2+Math.floor(r()*(N-4)),y=2+Math.floor(r()*(NH-4));if(!inYard(x,y)&&ok(map[y][x].g))put(t,x,y)}};
  const nd=c.nodes||{};want('herb',nd.herb??5,g=>g===0||g===7||g===9||g===11);want('ore',nd.ore??4,g=>g===6||g===8||g===10||g===11);want('wood',nd.wood??3,g=>g===0||g===9);
  if(nd.chest){const[x,y]=nd.chest;objs[y][x]=null;nodes.push({t:'chest',x:x+.5,y:y+.5,cd:0})}
}

function stageRegion(c){
  {const st=c.s&&GD.SECT_STYLE[c.s.id];if(st){c.rc=c.rc||st.roof;c.tree=c.tree||st.tree;c.props=c.props||st.props}}
  const R={name:c.name,hq:c.s.id,theme:c.th,size:c.w||40,h:c.h||40,stage:c,gen:()=>genStage(c),bake:()=>bakeHQ(c.th),zone:c.zone||(()=>c.name),

// ids: 입구부터 가장 깊은 곳까지. 성(省) 지도의 출입구는 첫 맵으로, 각 맵은 위 출입구로 다음 맵과 잇는다.

function linkChain(s,ids){
  const master=hqId(s),M=REGIONS[master],out=M.gates.find(g=>g.to.startsWith('pv_')||g.to==='gaebong');
  if(ids[0]!==master&&out){
    for(const R of Object.values(REGIONS))for(const g of R.gates||[])if(g.to===master&&R!==M&&(R.prov||g.inner)){g.to=ids[0];g.tx=20.5;g.ty=36.2}
    M.gates=M.gates.filter(g=>g!==out);REGIONS[ids[0]].gates.push({...out,x:20.5,y:38.6})}
  for(let i=1;i<ids.length;i++){const a=REGIONS[ids[i-1]],b=REGIONS[ids[i]],tx=stTopX(ids[i-1])+.5;
    a.gates.push({x:tx,y:1.2,to:ids[i],tx:20.5,ty:36.2,label:b.name,need:b.stage&&b.stage.need});
    b.gates.push({x:20.5,y:38.6,to:ids[i-1],tx,ty:3.6,label:a.name})}
  for(const id of ids)REGIONS[id].chain=ids}

  for(let i=lamps.length-1;i>=0;i--)if(objs[Math.floor(lamps[i].y)][Math.floor(lamps[i].x)]!=='lamp')lamps.splice(i,1)}}

const PV_W=40;

// 맵 이름: 성 이름 + 방위 (가운데 셋째는 방위 없음). 같은 이름이 겹치면 번호를 붙인다
function pvWinName(p,c,r){if(p.cols<=1)return p.n;const f=t=>t<1/3?0:t>2/3?2:1,nm=(c,r)=>`${p.n} ${['북','','남'][f((r+.5)/p.cols)]+['서','','동'][f((c+.5)/p.cols)]||'중'}부`;
  const same=[];for(let j=0;j<p.cols;j++)for(let i=0;i<p.cols;i++)if(nm(i,j)===nm(c,r))same.push(i+','+j);return same.length>1?`${nm(c,r)} ${same.indexOf(c+','+r)+1}`:nm(c,r)}

function pvSlice(k,c,r){

  builds=F.builds.filter(b=>b.x<ox+N&&b.x+b.w>ox&&b.y<oy+N&&b.y+b.h>oy).map(sh);nodes=F.nodes.filter(o=>inW(o.x,o.y)).map(sh);plots=[]}

  if(/장경각|서재|서각|문각|경각/.test(name))return'library';if(/연무/.test(name)||ids.some(i=>i.startsWith('dang_')))return'drill';if(/승방|침소/.test(name))return'room';

function hallFurnish(c,mid){const kit=c.kit||'hall',W=N,H=NH;
  const keep=(x,y)=>(x===mid&&y>=H-6)||(y===3&&Math.abs(x-mid)<=1)||(y===4&&(Math.abs(x-mid)===3||Math.abs(x-mid)<=1));
  const put=(k,x,y)=>{if(x>0&&y>0&&x<W-1&&y<H-1&&!objs[y][x]&&!keep(x,y)){objs[y][x]=k;return true}return false};
  const L=1,R=W-3,B=2,F=H-3;   // 왼쪽 벽 안쪽, 오른쪽 벽에서 한 칸 띄움(벽 앞면에 가려지지 않게), 뒷줄, 앞줄

  case'shop':back('counter',2,1);wallL('shelf',3);wallR('chest',2);put('jar',R,5);put('bolts',L,H-3);break;
  case'pharm':back('cabinet',2,-1);back('counter',1,1);wallL('cabinet',3);wallR('jar',3);put('kettle',R,H-3);break;
  case'cloth':back('counter',2,1);wallL('bolts',3);wallR('bolts',3);put('chest',L,H-3);put('table',W-4,F-1);break;
  case'store':wallL('chest',4);wallR('chest',4);back('chest',2,1);back('chest',2,-1);put('jar',3,F-1);put('jar',W-4,F-1);break;
  case'armory':wallL('rack',3);wallR('rack',3);back('chest',2,1);back('chest',2,-1);put('anvil',W-4,F-1);break;
  case'office':put('desk',mid,2);put('seat',mid,1)||put('seat',mid+1,2);wallL('shelf',2);wallR('cabinet',2);put('chest',L,H-3);put('table',W-4,F-1);break;
  case'shrine':put('altar',mid,2);put('altar',mid-1,2);put('altar',mid+1,2);wallL('jar',2);wallR('jar',2);put('table',3,F-1);put('table',W-4,F-1);break;

  case'library':back('shelf',3,1);back('shelf',3,-1);wallL('shelf',4);wallR('shelf',4);put('desk',mid,2);put('table',3,F-1);put('table',W-4,F-1);break;
  case'drill':wallL('rack',3);wallR('rack',3);back('rack',2,1);back('rack',2,-1);put('chest',L,H-3);put('chest',R,H-3);break;

// ================= 보법: 회피기 (경공과 따로) =================
// 경공은 멀리·높이 뛰는 이동기, 보법은 싸움 중 짧게 미끄러지는 회피기다. 설계: docs/세력_문파_설계.md 14장
// - 보법 버튼(터치) · Shift 또는 W(키보드). 쓰는 동안 잠깐 몸이 흐려져 피해를 받지 않는다(무적).
// - 두 타입
//   직선(line): 조이스틱 방향(놓았으면 바라보는 쪽)으로 정해진 거리만큼 곧게 미끄러진다. 적 사이는 빠져나가고 벽·물에서는 멈춘다.
//   간파(flank): 둘레를 살펴 공격하기 좋은 자리로 옮긴다. 상대 등 뒤를 잡고, 다른 적에게 둘러싸이지 않는 자리를 고른다.
//               등 뒤를 잡으면 다음 일격이 치명타가 된다. 조이스틱을 기울이고 있으면 그쪽 자리를 더 쳐 준다.
// - 등급(하승·중승·상승·절정)이 높을수록 미끄러지는 거리와 살피는 범위가 넓고, 다시 쓰는 시간이 짧다.
// - 살피는 자리 수는 등급과 상관없이 최대 96곳, 견주는 적은 가까운 순으로 최대 24명이라 절정에서도 1ms 안팎이다.
const BGRADE=GD.BGRADE;
const BG=GD.BG;
const BOBS=GD.BOBS;
// 얻는 곳: 하승·중승은 개봉 잡화점 비급, 상승은 문파 본산에서 정식제자 이상 공적 100, 절정은 호법(당주) 이상 공적 300
const BCOST=GD.BCOST,BRANK=GD.BRANK,BPRICE=GD.BPRICE;
const bobOf=()=>BOBS[P.bcur]||BOBS.b_basic;
function bobInit(){if(!P.bob)P.bob={b_basic:1};if(!P.bcur||!P.bob[P.bcur])P.bcur='b_basic';if(P.bcd2==null)P.bcd2=0}
function bobBlock(id,viaSect){const b=BOBS[id];bobInit();if(P.bob[id])return'이미 익혔다';
  if(b.g>=2){if(!viaSect)return'문파에서';if(!P.sect)return'문파 제자만';if(rankIdx(P.sect)<BRANK[b.g])return`${rankName(P.sect,BRANK[b.g])} 이상`;if((P.merit[P.sect]||0)<BCOST[b.g])return`공적 ${BCOST[b.g]} 필요`}
  return null}
function learnBob(id,viaSect){const b=BOBS[id],no=bobBlock(id,viaSect);if(no)return false;if(b.g>=2)P.merit[P.sect]-=BCOST[b.g];
  P.bob[id]=1;P.bcur=id;log(`보법 [${b.n}](${BGRADE[b.g]} · ${b.t==='line'?'직선':'간파'})을(를) 익혔습니다. 보법 버튼으로 씁니다.`,'xp');showBanner(b.n,`${BGRADE[b.g]} 보법`);return true}
function mkBBook(id){const b=BOBS[id];return{id:++itemId,slot:'bbook',bob:id,name:`보법 비급 · ${b.n}`,price:40}}

// ---- 자리 찾기 ----
// 가는 길이 막히지 않았나 (적은 빠져나가고, 벽·물·나무·바위에서 막힌다)
function bobClear(x0,y0,x1,y1){const l=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(l/.3));for(let i=1;i<=n;i++){const t=i/n;if(!walkAt(x0+(x1-x0)*t,y0+(y1-y0)*t))return false}return true}
function bobLine(b,dx,dy){const L=BG.len[b.g];let best=null;
  for(let d=L;d>=.6;d-=.15){const x=P.x+dx*d,y=P.y+dy*d;if(!walkAt(x,y)||!bobClear(P.x,P.y,x,y))continue;
    if(mobs.some(e=>e.hp>0&&Math.hypot(e.x-x,e.y-y)<.45))continue;best={x,y};break}
  return best}
// 간파: 후보 자리마다 점수를 매겨 가장 좋은 곳
function bobFlank(b,jx,jy){
  const R=BG.rad[b.g],fs=foes().filter(e=>dist(e,P)<R+3).sort((a,c)=>dist(a,P)-dist(c,P)).slice(0,24);
  let T=P.target&&P.target.hp>0&&dist(P.target,P)<R+2&&fs.includes(P.target)?P.target:fs[0]||null;
  const reach=Math.max(.9,Math.min(2.2,CLASS[hasWeaponFor(curCls())?curCls():'권'].reach*.8));
  const rings=Math.min(6,Math.max(3,Math.round(R/.9))),per=16;let best=null,bs=-1e9,tried=0;
  for(let r=1;r<=rings;r++){const rad=R*r/rings;
    for(let k=0;k<per;k++){const a=(k+(r%2)*.5)/per*Math.PI*2,x=P.x+Math.cos(a)*rad,y=P.y+Math.sin(a)*rad;tried++;
      if(!walkAt(x,y))continue;let s=0,near=0,close=9;
      for(const e of fs){const d=Math.hypot(e.x-x,e.y-y);close=Math.min(close,d);if(e!==T&&d<1.7)near++}
      if(close<.55)continue;
      s-=near*3;                                              // 다른 적에게 둘러싸이면 나쁘다
      if(T){const tx=x-T.x,ty=y-T.y,td=Math.hypot(tx,ty)||1;
        s-=Math.abs(td-reach)*2.2;                            // 칼이 닿는 거리
        const back=-(tx*(T.fx||0)+ty*(T.fy||0))/td;s+=back*3.5}  // 상대 등 뒤
      else{s+=Math.min(4,close)*.8}                           // 상대가 없으면 적에게서 멀리
      if(jx||jy)s+=((x-P.x)*jx+(y-P.y)*jy)/rad*2.5;           // 조이스틱 쪽
      s-=rad*.15;
      if(s>bs&&bobClear(P.x,P.y,x,y)){bs=s;best={x,y,T,back:T?-((x-T.x)*(T.fx||0)+(y-T.y)*(T.fy||0))/(Math.hypot(x-T.x,y-T.y)||1):0}}}}
  BOB_STAT.tried=tried;BOB_STAT.foes=fs.length;return best}
const BOB_STAT=GD.BOB_STAT;
function bobeop(){
  if(!P||P.hp<=0||P.leap)return false;bobInit();
  if(P.perch){perchDrop();return true}
  const b=bobOf(),q=BG.qi[b.g];
  if((P.bcd2||0)>0)return false;if(P.qi<q){log('내공이 부족합니다.','info');return false}
  const t0=performance.now(),jx=joy.on?joy.gx:0,jy=joy.on?joy.gy:0;
  let dst=null;
  if(b.t==='flank')dst=bobFlank(b,jx,jy);
  if(!dst){const dx=jx||jy?jx:P.fx,dy=jx||jy?jy:P.fy;dst=bobLine(b,dx,dy)}
  BOB_STAT.ms=performance.now()-t0;
  if(!dst){addText(P.x,P.y,'막혔다','#9a8d72');return false}
  P.qi-=q;P.bcd2=BG.cd[b.g];P.bmax=BG.cd[b.g];P.inv=Math.max(P.inv,BG.inv[b.g]);P.path=null;P.chan=null;P.medit=false;
  P.leap={sx:P.x,sy:P.y,ex:dst.x,ey:dst.y,t:0,dur:.2+Math.hypot(dst.x-P.x,dst.y-P.y)*.025,z0:0,z1:0,to:null,step:1};
  for(let i=0;i<4;i++)fx.push({t:'ghost',x:P.x+(dst.x-P.x)*i/4,y:P.y+(dst.y-P.y)*i/4,life:.3+i*.05,col:'190,220,255'});
  if(dst.T){P.target=dst.T;if(dst.back>.5){P.buff.crit=Math.max(P.buff.crit||0,1.4);addText(dst.x,dst.y,'배후','#ffd36a')}}
  if(typeof sfx==='function')sfx('dodge');
  return true}
// 보법이 끝나면 상대를 바라본다
function bobLand(L){if(L.step&&P.target&&P.target.hp>0)face(P.target.x,P.target.y)}

// ================= 경지 밸런스: 플레이어 대 NPC·몹 =================
// 사용자 요청(2026-10-09): 경지에 따른 플레이어와 NPC 사이의 밸런스. 제안서 /mnt/project-files/docs/경지_밸런스_제안.md 1~3번.
// 1) 모든 사람 몹·NPC에 경지를 붙인다 (문파 무인은 직위가 곧 경지)
// 2) 경지 표준 능력치(그 경지에 갓 오른 플레이어의 맨몸 수치)에 졸개·정예·보스 배율을 곱해 능력치를 정한다
// 3) 경지 한 단계 차이마다 주는 피해 ±15%, 명중·회피 ±5% (최대 세 단계). 플레이어와 NPC, NPC끼리 모두
// 설계: docs/경지_설계.md 3부

// 경지 표준: 공격력·생명·현묘도 (tests로 뽑은 정파 검객의 문턱 수치)
const STD=GD.STD;
// 졸개는 약하게, 정예는 같은 경지 한 사람 몫, 보스는 준비해야 이긴다
const TIER=GD.TIER;
// 사람 몹의 경지 (짐승은 경지만 붙이고 수치는 그대로)
const MOB_REALM=GD.MOB_REALM;
// 혈교무인·강시는 졸개가 아니라 정예 몫
const MOB_TIER=GD.MOB_TIER;
function scaleMob(e){const d=e.d;if(!d||d.beast||d.villager||d.passive||e.realm==null)return e;
  const r=clamp(e.realm,0,6),[a,h,m]=STD[r],t=TIER[d.boss?'b':d.elite||MOB_TIER[e.kind]==='e'?'e':'n'];
  e.maxHp=e.hp=Math.round(h*t.h);e.atk=Math.round(a*t.a);e.hm=d.hm!=null&&d.hm<5?d.hm:Math.round(m*t.m);   // 강시처럼 굼뜬 몹은 그대로
  e.def=Math.max(d.def||0,Math.round((1+r*1.5)*t.d));return e}
hook('mobMade',(e,kind,extra)=>{if(MOB_REALM[kind]!=null&&!extra){e.realm=MOB_REALM[kind];scaleMob(e)}});
// 문파 무인: 직위(0 속가·졸개·교도, 1 정식·정예, 2 일대·조장·향주, 3 호법·당주)가 경지
hook('facMade',e=>{e.realm=e.rank||0;scaleMob(e)});

// 경지 차이: 한 단계마다 ±15% 피해, ±5% 명중 (세 단계까지)
const rDiff=(a,b)=>clamp(a-b,-3,3);
const rMul=dd=>1+.15*dd;
hook('hit',c=>{const dd=rDiff(realmIdx(),mobRealm(c.e));c.hm-=5.5*dd;c.m*=rMul(dd)});
hook('hurt',c=>{if(!c.src.d)return;const dd=rDiff(mobRealm(c.src),realmIdx());c.hm+=10*dd;c.dm*=rMul(dd)});
hook('mobHurt',c=>{if(c.src&&c.src.d&&c.t.d)c.dm*=rMul(rDiff(mobRealm(c.src),mobRealm(c.t)))});

// ---- 4) 지역 위험도: 지역마다 나오는 경지의 바닥(lo)과 천장(hi) ----
// 졸개·정예의 경지는 min(hi, 원래 경지 + lo). 보스는 제 경지 그대로. 짐승은 lo보다 낮으면 lo로 끌어올려 수치도 표준 비율만큼 키운다.
const PV_DANGER=GD.PV_DANGER;
function danger(id=REG){const R=REGIONS[id];if(!R||id==='gaebong')return[0,0];
  if(id==='sungsan')return[0,1];
  if(/천마동|달마동/.test(R.name||''))return[5,5];
  if(id.startsWith('hq_cheonma'))return[3,4];
  if(id.endsWith('_back'))return[2,3];
  const k=R.prov||(id.startsWith('pv_')?id.slice(3).split('@')[0]:null),b=PV_DANGER[k]||[0,1];
  if(R.lm&&R.lm.t==='m')return[Math.min(5,b[0]+1),Math.min(5,b[1]+1)];   // 명산은 한 단계 위
  return b}
function regionRealm(e,base){const[lo,hi]=danger();return Math.max(base,Math.min(hi,base+lo))}
function liftBeast(e){const lo=danger()[0],r0=e.realm??0;e.realm=r0;if(lo<=r0)return e;
  const fh=STD[lo][1]/STD[r0][1],fa=STD[lo][0]/STD[r0][0];e.maxHp=e.hp=Math.round(e.maxHp*fh);e.atk=Math.round(e.atk*fa);e.realm=lo;return e}
hook('mobMade',(e,kind,extra)=>{if(extra||!e.d||e.d.boss||e.d.villager||e.d.passive||e.realm==null||e.d.fac)return;
  if(e.d.beast)return liftBeast(e);const r=regionRealm(e,e.realm);if(r!==e.realm){e.realm=r;scaleMob(e)}});

  if(r!==e.realm){e.realm=r;if(e.sect){e.rank=Math.min(r,4);e.name=`${SECTS[e.sect].n} ${rankName(e.sect,e.rank)}`}  /* 초절정 이상은 장로 */scaleMob(e)}});

// ================= 소리: 배경음악과 효과음 =================
// 바깥 음원 파일 없이 Web Audio로 그 자리에서 연주한다 (저작권 걱정 없음, 파일 크기 0).
// - 배경음악: 오음 음계(궁·상·각·치·우)로 가야금(고쟁) 같은 뜯는 소리, 대금(적) 같은 피리, 북을 그때그때 지어 낸다.
//   개봉(마을)은 밝고 느리게, 성·본산(들판)은 쓸쓸하게, 싸움이 붙으면 북이 빨라진다.
// - 효과음: 칼바람, 타격, 치명타, 맞음, 쓰러뜨림, 초식, 필살기(징), 경공, 은자·물건 줍기, 창 열기, 깨달음, 지역 이동, 죽음 등.
// - 브라우저는 사람이 화면을 한 번 눌러야 소리를 낼 수 있어서 첫 손길에 켠다. 앱이 뒤로 가면 음악을 멈춘다.
// 설정: ☰ 메뉴(또는 조작법 창)의 배경음악·효과음 켬/끔. 기기 안에만 둔다(STORE, 'ganghoyunhoe-snd').
const SND_KEY='ganghoyunhoe-snd';
const SND=(()=>{let o={m:1,s:1,mv:.5,sv:.7};try{Object.assign(o,JSON.parse(STORE.get(SND_KEY)||'{}'))}catch(e){}return o})();
const sndSave=()=>{try{STORE.set(SND_KEY,JSON.stringify(SND),1)}catch(e){}};
let AC=null,AMaster=null,AMus=null,ASfx=null,ARev=null,ANoise=null;
function audioInit(){
  if(AC){if(AC.state==='suspended'&&!document.hidden)AC.resume();return AC}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{AC=new C()}catch(e){return null}
  AMaster=AC.createGain();AMaster.gain.value=1;const cp=AC.createDynamicsCompressor();cp.threshold.value=-10;cp.ratio.value=4;AMaster.connect(cp);cp.connect(AC.destination);
  AMus=AC.createGain();AMus.gain.value=SND.m?SND.mv*1.4:0;ASfx=AC.createGain();ASfx.gain.value=SND.s?SND.sv:0;
  // 잔향: 짧게 감쇠하는 잡음으로 만든 공간감 (산사·계곡 느낌)
  ARev=AC.createConvolver();const L=AC.sampleRate*2.4|0,ir=AC.createBuffer(2,L,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2)}ARev.buffer=ir;

  AMus.connect(AMaster);AMus.connect(ARev);ASfx.connect(AMaster);const sw=AC.createGain();sw.gain.value=.35;ASfx.connect(sw);sw.connect(ARev);
  const nl=AC.sampleRate*2|0;ANoise=AC.createBuffer(1,nl,AC.sampleRate);const nd=ANoise.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;

// 첫 손길에 켠다
for(const ev of['pointerdown','keydown','touchend'])addEventListener(ev,()=>audioInit(),{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
function sndApply(){if(!AC)return;const t=AC.currentTime;AMus.gain.setTargetAtTime(SND.m?SND.mv*1.4*MUS.fade:0,t,.15);ASfx.gain.setTargetAtTime(SND.s?SND.sv:0,t,.05)}

// ---- 소리 재료 ----
const mtof=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec,end=.0001){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(end,t+a+dec)}
function tone(dst,t,f,type,peak,a,dec,f2,detune){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+dec);if(detune)o.detune.value=detune;
  env(g,t,a,peak,dec);o.connect(g);g.connect(dst);o.start(t);o.stop(t+a+dec+.05);return o}
function noise(dst,t,peak,a,dec,ftype,f1,f2,q=1){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=ANoise;s.loop=true;
  fl.type=ftype;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+a+dec);fl.Q.value=q;
  env(g,t,a,peak,dec);s.connect(fl);fl.connect(g);g.connect(dst);s.start(t,Math.random()*1.5);s.stop(t+a+dec+.05)}
// 뜯는 줄 소리 (카플러스-스트롱): 음높이마다 한 번 만들어 둔다
const PLUCK={};
function pluckBuf(f){const k=Math.round(f*10);if(PLUCK[k])return PLUCK[k];
  const sr=AC.sampleRate,len=sr*2.2|0,b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),n=Math.max(2,Math.round(sr/f)),ring=new Float32Array(n);
  let prev=0;for(let i=0;i<n;i++){const v=Math.random()*2-1;prev=prev*.45+v*.55;ring[i]=prev}
  let p=0;for(let i=0;i<len;i++){const a=ring[p],nx=ring[(p+1)%n];d[i]=a;ring[p]=(a+nx)*.4985;p=(p+1)%n}
  return PLUCK[k]=b}
function pluck(dst,t,m,vol=.5,pan=0){const s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();s.buffer=pluckBuf(mtof(m));
  lp.type='lowpass';lp.frequency.value=Math.min(9000,mtof(m)*7);g.gain.value=vol;s.connect(lp);lp.connect(g);
  if(AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=pan;g.connect(pn);pn.connect(dst)}else g.connect(dst);s.start(t);s.stop(t+2.2)}
// 피리: 사인파에 떨림과 숨소리
function flute(dst,t,m,dur,vol=.12){const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();o.type='sine';o.frequency.value=mtof(m);
  lfo.frequency.value=5.2;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(mtof(m)*.012,t+dur*.5);lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.18);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dst);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);noise(dst,t,vol*.25,.05,dur*.6,'bandpass',mtof(m)*2,null,2)}
// 북: 큰북(둥), 작은북(딱), 목탁
function drum(dst,t,k,vol=1){
  if(k==='big'){tone(dst,t,110,'sine',.7*vol,.004,.5,42);noise(dst,t,.25*vol,.002,.12,'lowpass',900,200)}
  else if(k==='mid'){tone(dst,t,180,'sine',.45*vol,.003,.25,90);noise(dst,t,.18*vol,.002,.08,'bandpass',1200,500,1.5)}
  else if(k==='wood'){tone(dst,t,820,'sine',.22*vol,.001,.07,700)}
  else{noise(dst,t,.16*vol,.001,.05,'highpass',3000)}}
// 징·종: 어긋난 배음들이 길게 운다
function gong(dst,t,f,vol,dec){[[1,1],[1.48,.6],[2.02,.45],[2.74,.3],[3.9,.18]].forEach(([r,a])=>tone(dst,t,f*r,'sine',vol*a,.01,dec*(1.2-r*.15),f*r*.985))}

let sfxLast={};
function sfx(k,o={}){
  if(!AC||!SND.s||document.hidden)return;const t=AC.currentTime,D=ASfx;
  // 같은 소리가 한 순간에 몰리면 줄인다
  const lim={hit:.04,crit:.06,swing:.05,ehit:.05,kill:.06,coin:.05,step:.1}[k]||.02;if(t-(sfxLast[k]||0)<lim)return;sfxLast[k]=t;
  const v=o.v==null?1:o.v;
  switch(k){
    case'swing':{const c=o.cls||'검',hi=c==='검'?1:c==='창'||c==='봉'?.7:c==='도'?.8:c==='궁'?1.2:.5;
      noise(D,t,.28*v,.01,.16,'bandpass',2600*hi,700*hi,1.2);if(c==='검')tone(D,t+.02,2800,'sine',.03*v,.002,.25,2700);break}
    case'bow':tone(D,t,180,'triangle',.25*v,.002,.12,90);noise(D,t,.15*v,.002,.25,'bandpass',3000,1200,2);break;
    case'hit':noise(D,t,.4*v,.001,.07,'bandpass',1800,600,.8);tone(D,t,150,'sine',.5*v,.002,.13,60);break;
    case'crit':noise(D,t,.5*v,.001,.09,'bandpass',2400,800,.8);tone(D,t,130,'sine',.6*v,.002,.18,50);

    case'dodge':noise(D,t,.16,.02,.16,'bandpass',1500,3500,1.5);break;

    case'form':{const f=o.f||660;noise(D,t,.3,.01,.2,'bandpass',3000,900,1.4);tone(D,t,f,'sine',.12,.005,.4,f*1.5);tone(D,t+.06,f*1.5,'sine',.07,.005,.35);break}
    case'ult':gong(D,t,92,.55,3.2);noise(D,t,.08,.4,1.4,'bandpass',600,2600,.7);drum(D,t,'big',1.2);break;
    case'leap':noise(D,t,.24,.03,.35,'bandpass',600,3200,1.2);break;
    case'land':noise(D,t,.12,.002,.08,'lowpass',500);break;
    case'coin':tone(D,t,1950,'sine',.16*v,.002,.18);tone(D,t+.06,2630,'sine',.14*v,.002,.3);break;
    case'item':pluck(D,t,79,.35);pluck(D,t+.07,86,.3);break;
    case'book':noise(D,t,.12,.02,.18,'bandpass',4200,2000,.9);noise(D,t+.14,.1,.02,.16,'bandpass',3600,1800,.9);break;
    case'ui':tone(D,t,900,'sine',.12,.001,.06,760);break;
    case'open':tone(D,t,700,'sine',.1,.001,.08,560);noise(D,t,.05,.01,.1,'bandpass',3000,1500);break;
    case'close':tone(D,t,560,'sine',.08,.001,.07,480);break;
    case'tier':[74,76,79,81,86].forEach((m,i)=>pluck(D,t+i*.075,m,.42,(i-2)*.2));gong(D,t+.4,587,.05,1.8);break;
    case'learn':[69,74,76,81].forEach((m,i)=>pluck(D,t+i*.09,m,.4));break;
    case'travel':noise(D,t,.18,.25,.9,'bandpass',400,1600,.8);[81,86].forEach((m,i)=>pluck(D,t+.35+i*.12,m,.25));break;
    case'die':gong(D,t,70,.6,4.5);[62,58,55,50].forEach((m,i)=>pluck(D,t+.3+i*.35,m,.35));break;

    case'train':drum(D,t,'big',.9);drum(D,t+.12,'mid',.5);break;
    case'chop':tone(D,t,320,'triangle',.25,.002,.08,200);noise(D,t,.2,.001,.06,'bandpass',1500,700);break;
    case'dig':noise(D,t,.22,.003,.12,'bandpass',900,400,1.5);tone(D,t,1400,'sine',.05,.001,.12);break;
    case'herb':noise(D,t,.12,.02,.2,'highpass',2500,4000);break;
    case'buy':tone(D,t,1750,'sine',.14,.002,.15);tone(D,t+.05,2350,'sine',.12,.002,.2);tone(D,t+.1,2950,'sine',.1,.002,.3);break;
    case'error':tone(D,t,220,'square',.05,.002,.12,200);break;
  }}

// ---- 배경음악 ----
// 음계: 반음 간격. 개봉 궁조(밝음), 들판 우조(쓸쓸함), 싸움 각조풍(급함)
const MODES={
  town:{root:62,sc:[0,2,4,7,9],bpm:72,dens:.42,flute:.35,drum:0,pad:0},
  field:{root:57,sc:[0,3,5,7,10],bpm:62,dens:.28,flute:.5,drum:0,pad:1},
  night:{root:57,sc:[0,3,5,7,10],bpm:54,dens:.2,flute:.25,drum:0,pad:1},
  battle:{root:64,sc:[0,3,5,7,10],bpm:116,dens:.55,flute:0,drum:1,pad:0},
  title:{root:62,sc:[0,2,4,7,9],bpm:58,dens:.25,flute:.6,drum:0,pad:1}};
const MUS={mode:null,want:'title',step:0,next:0,deg:4,fade:1,timer:null,combatT:0,padNodes:null,phrase:0};
function musStart(){if(MUS.timer)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(musTick,90)}
function musWant(){
  if(!playing)return'title';
  if(typeof inCombat==='function'&&P&&P.hp>0&&inCombat())MUS.combatT=performance.now();
  if(performance.now()-MUS.combatT<4500)return'battle';
  if(REG==='gaebong')return'town';
  return typeof tod==='number'&&(tod<.2||tod>.8)?'night':'field'}
function padOn(m){padOff();if(!m.pad)return;const t=AC.currentTime,g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+3);
  const os=[0,7,12].map((iv,i)=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=mtof(m.root-12+iv);o.detune.value=(i-1)*6;o.connect(lp);o.start(t);return o});
  lp.connect(g);g.connect(AMus);MUS.padNodes={g,os}}
function padOff(){const p=MUS.padNodes;if(!p)return;const t=AC.currentTime;p.g.gain.setTargetAtTime(.0001,t,.6);p.os.forEach(o=>o.stop(t+3));MUS.padNodes=null}
function musTick(){
  if(!AC||AC.state!=='running')return;const want=musWant();
  // 분위기가 바뀌면 소리를 줄였다가 새 가락으로
  if(want!==MUS.mode){if(MUS.mode&&MUS.fade>0){MUS.fade=Math.max(0,MUS.fade-.12);sndApply();if(MUS.fade>0)return}
    MUS.mode=want;MUS.step=0;MUS.next=AC.currentTime+.05;MUS.deg=4;padOn(MODES[want])}
  else if(MUS.fade<1){MUS.fade=Math.min(1,MUS.fade+.08);sndApply()}
  if(!SND.m){MUS.next=AC.currentTime+.1;return}
  const m=MODES[MUS.mode],st=60/m.bpm/2;
  while(MUS.next<AC.currentTime+.3){musStep(m,MUS.step,MUS.next,st);MUS.step++;MUS.next+=st*(MUS.step%2?1.04:.96)}}
const noteOf=(m,deg)=>{const n=m.sc.length,o=Math.floor(deg/n);return m.root+o*12+m.sc[((deg%n)+n)%n]};
function musStep(m,s,t,st){
  const bar=Math.floor(s/8),b=s%8,D=AMus;
  // 낮은 줄: 두 마디마다 으뜸음과 5도
  if(b===0&&bar%2===0){pluck(D,t,m.root-24,.5,-.3);pluck(D,t+st*2,m.root-17,.32,-.3)}
  if(m.drum){const pat=[['big',1],null,['tick',.6],['mid',.7],['big',.9],['tick',.5],['mid',.8],['wood',.6]][b];if(pat)drum(D,t,pat[0],pat[1]*.8);if(b===0&&bar%4===3)drum(D,t+st,'big',.9)}
  else if(b===0&&bar%4===0)drum(D,t,'wood',.35);
  // 가락: 음계 위를 걷다가 마디 끝에서 쉰다. 네 마디마다 훑어 올리기
  if(b===0&&bar%4===0&&Math.random()<.6){for(let i=0;i<5;i++)pluck(D,t+i*.045,noteOf(m,MUS.deg-4+i),.18,.2)}
  const rest=bar%4===3&&b>=4;
  if(!rest&&Math.random()<m.dens*(b%2?.7:1.2)){
    MUS.deg+=[-2,-1,-1,1,1,2,0][Math.random()*7|0];if(MUS.deg<0)MUS.deg=2;if(MUS.deg>11)MUS.deg=8;
    const n=noteOf(m,MUS.deg);pluck(D,t,n,.42,.15);
    if(Math.random()<.15)pluck(D,t+st*.5,n+(Math.random()<.5?2:-2),.2,.15);   // 꾸밈음
    if(m.drum&&Math.random()<.4)pluck(D,t,n-12,.25,-.1)}
  // 피리: 네 마디에 한 번쯤 긴 음
  if(m.flute&&b===0&&bar%4===1&&Math.random()<m.flute){const n=noteOf(m,5+(Math.random()*4|0));flute(D,t,n,st*6);if(Math.random()<.6)flute(D,t+st*6,noteOf(m,4+(Math.random()*3|0)),st*7)}}

// ---- 게임에 소리 붙이기 (기존 함수를 감싼다) ----
const sndNear=e=>!e||!P||Math.hypot(e.x-P.x,e.y-P.y)<10;
{const wrap=(name,fn)=>{const o=window[name];if(typeof o!=='function')return;window[name]=function(...a){return fn(o,a,this)}};
  wrap('damage',(o,a)=>{const[e,d,kb,stun,from,crit]=a,was=e&&e.hp>0;const r=o(...a);if(was&&sndNear(e)&&(from===undefined||from===P||allies.includes(from)))sfx(crit?'crit':'hit',{v:from&&from!==P?.5:1});if(was&&e.hp<=0&&sndNear(e))sfx('kill');return r});

    const mx=((m.x%1)+1)%1*W,my=m.y*H;if(dark>.3){ctx.fillStyle=`rgba(210,255,140,${(.35+.35*Math.sin(time*3+m.p))*dark})`;ctx.fillRect(mx,my,1.8*m.s,1.8*m.s)}
    else if(sea==='봄'||sea==='가을'){ctx.fillStyle=sea==='봄'?'rgba(245,200,215,.7)':'rgba(220,130,50,.7)';ctx.beginPath();ctx.ellipse(mx,my,2.6*m.s,1.3*m.s,time*2+m.p,0,7);ctx.fill()}}
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
// minimap: baked terrain + live dots
const MINI=$('mini'),mctx=MINI.getContext('2d');let miniBase=null;
function bakeMini(){const c=document.createElement('canvas');c.width=150;c.height=84;const g=c.getContext('2d');const col=['#3e5a2a','#8a7454','#2a4a5a','#7a5a3a','#8a8678','#5a4430','#3a3634','#6a5a44','#d8dde4','#4a4a30','#8a4a32','#2a2626','#c8a870','#7a5a3a'];
  for(let y=0;y<NH;y++)for(let x=0;x<N;x++){const[px,py]=miniXY(x+.5,y+.5),ms=80/(N+NH);g.fillStyle=objs[y][x]&&objs[y][x]!=='lamp'?(objs[y][x]==='B'||objs[y][x]==='tent'?'#c9b48a':objs[y][x]==='wall'||objs[y][x]==='pillar'||objs[y][x]==='screen'||objs[y][x]==='stupa'?'#8a8678':FURN[objs[y][x]]?'#6a4a2a':objs[y][x]==='plum'?'#6a3a4a':objs[y][x]==='maple'?'#6a3a1a':'#26381a'):col[map[y][x].g];g.fillRect(px-1.5*ms,py-ms,3.2*ms,2.2*ms)}miniBase=c}
const miniXY=(x,y)=>[75+((x-y)-(N-NH)/2)*148/(N+NH),2+(x+y)*80/(N+NH)];   // 가로 N 세로 NH 마름모를 150×84 안에
function drawMini(){if(!P)return;if(!miniBase)bakeMini();mctx.clearRect(0,0,150,84);mctx.drawImage(miniBase,0,0);
  for(const m of mobs){const[x,y]=miniXY(m.x,m.y);mctx.fillStyle=m.d.boss?'#ff5040':m.d.fac&&peaceful(m)?'#7ab0e0':m.d.hostile?'#d06050':m.d.villager?'#c8c0a8':'#a0c080';mctx.fillRect(x-1,y-1,m.d.boss?3:2,m.d.boss?3:2)}
  for(const g of REGION().gates){const[x,y]=miniXY(g.x,g.y);mctx.fillStyle='#ffe2a0';mctx.fillRect(x-2,y-2,4,4)}
  for(const n of NPCF){const[x,y]=miniXY(n.x,n.y);mctx.fillStyle='#e8c66e';mctx.fillRect(x-1,y-1,2,2)}
  for(const t of tombs()){if((t.reg||'gaebong')!==REG)continue;const[x,y]=miniXY(t.x,t.y);mctx.fillStyle='#b8a8ff';mctx.fillRect(x-2,y-2,4,4)}
  if(G.giyeon){const[x,y]=miniXY(G.giyeon.x,G.giyeon.y);mctx.fillStyle='#fff3b0';mctx.fillRect(x-2,y-2,4,4)}
  const[x,y]=miniXY(P.x,P.y);mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(x,y,2.4,0,7);mctx.fill()}

// ================= boot =================
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{if(playing&&!paused)update(dt);else time+=dt*.2;draw();if(playing){hud();drawMini()}}catch(err){console.error(err);if(!loop.err){loop.err=1;log('오류: '+err.message,'dmg')}}
  requestAnimationFrame(loop)}
loadRegion('gaebong');embers=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),s:.4+Math.random(),p:Math.random()*6}));
buildBar();resize();{const t=iso(20.5,20.5);cam.x=t.x;cam.y=t.y}
showTitle();requestAnimationFrame(loop);

</script>
